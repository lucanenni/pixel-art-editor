<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pixel art editor</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1>Pixel art editor</h1>

      <div class="editor-area">
        <div class="canvas-section">
          <canvas
            id="pixelCanvas"
            width="512"
            height="512"
            aria-label="Area di disegno, griglia 32 per 32 celle"
          ></canvas>
          <div class="buttons">
            <button id="undoBtn" class="btn-undo" onclick="undo()" disabled>
              Annulla
            </button>
            <button id="redoBtn" class="btn-redo" onclick="redo()" disabled>
              Ripeti
            </button>
            <button class="btn-clear" onclick="clearAll()">
              Cancella tutto
            </button>
            <button class="btn-download" onclick="downloadImage()">
              Scarica immagine
            </button>
            <button class="btn-qr" onclick="showQRCode()">
              Mostra QR code
            </button>
            <button class="btn-export" onclick="exportDrawing()">
              Esporta JSON
            </button>
            <button
              class="btn-import"
              onclick="document.getElementById('importFile').click()"
            >
              Importa JSON
            </button>
            <button class="btn-export" onclick="exportDrawingXML()">
              Esporta XML
            </button>
            <button
              class="btn-import"
              onclick="document.getElementById('importFileXML').click()"
            >
              Importa XML
            </button>
          </div>
          <input
            type="file"
            id="importFile"
            accept=".json"
            style="display: none"
            onchange="importDrawing(event)"
          />
          <input
            type="file"
            id="importFileXML"
            accept=".xml"
            style="display: none"
            onchange="importDrawingXML(event)"
          />
        </div>

        <div class="right-panel">
          <div class="horizontal-panel">
            <div class="control-group">
              <h3 id="currentColorLabel">Colore</h3>
              <div
                id="currentColor"
                class="current-color"
                role="img"
                aria-labelledby="currentColorLabel"
                aria-label="rgb(0,0,0)"
              ></div>
            </div>
            <div class="control-group">
              <label for="gridSizeSelect">Griglia</label>
              <select id="gridSizeSelect" onchange="changeGridSize()">
                <option value="8">8x8</option>
                <option value="12">12x12</option>
                <option value="16">16x16</option>
                <option value="24">24x24</option>
                <option value="32" selected>32x32</option>
              </select>
            </div>
            <div class="control-group">
              <label for="paletteSelect">Palette</label>
              <select id="paletteSelect" onchange="changePalette()">
                <option value="cga">CGA (16 colori)</option>
                <option value="ega">EGA (64 colori)</option>
                <option value="vga" selected>VGA (256 colori)</option>
              </select>
            </div>
          </div>
          <div class="control-group">
            <h3 id="toolGroupLabel">Strumento</h3>
            <div class="tool-group" role="group" aria-labelledby="toolGroupLabel">
              <button
                type="button"
                class="tool-btn"
                data-tool="brush"
                aria-pressed="true"
                aria-label="Pennello"
                title="Pennello"
                onclick="setTool('brush')"
              >
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <line x1="4" y1="20" x2="13" y2="11"></line>
                  <path d="M13 11 L19 5 C20 4 21.5 4 22 5 C22.5 6 22 7.5 21 8 L15 14 Z" fill="currentColor" stroke="none"></path>
                </svg>
              </button>
              <button
                type="button"
                class="tool-btn"
                data-tool="eyedropper"
                aria-pressed="false"
                aria-label="Contagocce"
                title="Contagocce"
                onclick="setTool('eyedropper')"
              >
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <line x1="20" y1="4" x2="14" y2="10" stroke-width="5"></line>
                  <line x1="13" y1="11" x2="7" y2="17" stroke-width="2"></line>
                  <path d="M7 17 L5 21 L9 19 Z" fill="currentColor" stroke="none"></path>
                </svg>
              </button>
              <button
                type="button"
                class="tool-btn"
                data-tool="bucket"
                aria-pressed="false"
                aria-label="Secchiello"
                title="Secchiello"
                onclick="setTool('bucket')"
              >
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M5 8 L19 8 L17 19 C17 20.1 14.8 21 12 21 C9.2 21 7 20.1 7 19 Z"></path>
                  <line x1="5" y1="8" x2="7" y2="4"></line>
                  <line x1="19" y1="8" x2="17" y2="4"></line>
                  <circle cx="21" cy="14" r="1.3" fill="currentColor" stroke="none"></circle>
                </svg>
              </button>
            </div>
          </div>
          <div class="control-group">
            <h3 id="colorPaletteLabel">Tavolozza colori</h3>
            <div
              id="colorPalette"
              role="group"
              aria-labelledby="colorPaletteLabel"
            ></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Modale per QR Code -->
    <div id="qrModal" class="modal" onclick="closeQRModal()">
      <div
        class="modal-content"
        role="dialog"
        aria-modal="true"
        aria-labelledby="qrModalTitle"
        onclick="event.stopPropagation()"
      >
        <button
          type="button"
          id="qrModalCloseBtn"
          class="close"
          onclick="closeQRModal()"
          aria-label="Chiudi"
        >
          &times;
        </button>
        <h2 id="qrModalTitle">QR code del tuo disegno</h2>
        <div id="qrcode"></div>
        <div id="qrMessage"></div>
      </div>
    </div>

    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"
      integrity="sha512-CNgIRecGo7nphbeZ04Sc13ka07paqdeTu0WR1IM4kNcpmBAUSHSQX0FslNhTDadL4O5SAGapGt4FodqL8My0mA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>
    <script src="logic.js"></script>
    <script src="script.js"></script>
  </body>
</html>
